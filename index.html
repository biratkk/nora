<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora ACP Dashboard</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #0e0e12;
  --bg-surface:#16161c;
  --bg-raised: #1e1e28;
  --bg-hover:  #252532;
  --bg-active: #2a2a3c;
  --border:    #2e2e3e;
  --text:      #c9cdd7;
  --text-dim:  #6c7086;
  --text-bright:#e4e7f0;
  --accent:    #7aa2f7;
  --green:     #9ece6a;
  --red:       #f7768e;
  --yellow:    #e0af68;
  --blue:      #7aa2f7;
  --gray:      #565f89;
  --cyan:      #7dcfff;
  --purple:    #bb9af7;
  --font-mono: 'SF Mono','Cascadia Code','Fira Code','JetBrains Mono',monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sidebar-w: 320px;
  --topbar-h:  48px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.6;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}

/* ── Layout ────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;flex-direction:column}
#topbar{
  height:var(--topbar-h);min-height:var(--topbar-h);
  background:var(--bg-surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:12px;
  flex-shrink:0;
}
#topbar .logo{font-weight:700;font-size:15px;color:var(--text-bright);display:flex;align-items:center;gap:8px}
#topbar .logo span{color:var(--accent)}
#conn-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
#conn-status.ok{background:var(--green)}
#conn-status.err{background:var(--red)}
#conn-label{font-size:12px;color:var(--text-dim)}
.topbar-spacer{flex:1}
#btn-refresh{
  background:transparent;border:1px solid var(--border);color:var(--text-dim);
  padding:4px 12px;border-radius:6px;font-size:12px;
}
#btn-refresh:hover{border-color:var(--accent);color:var(--accent)}
#btn-sidebar-toggle{
  display:none;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);padding:4px 10px;border-radius:6px;font-size:14px;
}

#body{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ───────────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--bg-surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
#sidebar-header{padding:12px;border-bottom:1px solid var(--border)}
#sidebar-header h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:8px}
#filter-input{
  width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-raised);color:var(--text);font-size:13px;outline:none;
}
#filter-input:focus{border-color:var(--accent)}
#filter-input::placeholder{color:var(--text-dim)}
#session-list{flex:1;overflow-y:auto;padding:4px 0}
.session-item{
  padding:10px 12px;cursor:pointer;border-left:3px solid transparent;
  transition:background .15s,border-color .15s;
}
.session-item:hover{background:var(--bg-hover)}
.session-item.active{background:var(--bg-active);border-left-color:var(--accent)}
.session-item .name{font-size:13px;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.session-item .time{font-size:11px;color:var(--text-dim)}

/* ── Badges ────────────────────────────────────────────────────── */
.badge{
  display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;
  font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.6;
}
.badge-vibe{background:#7aa2f722;color:var(--blue)}
.badge-plan{background:#bb9af722;color:var(--purple)}
.badge-act{background:#9ece6a22;color:var(--green)}
.badge-completed{background:#9ece6a22;color:var(--green)}
.badge-in-progress{background:#7aa2f722;color:var(--blue);animation:pulse 1.5s ease-in-out infinite}
.badge-awaiting{background:#e0af6822;color:var(--yellow)}
.badge-failed{background:#f7768e22;color:var(--red)}
.badge-cancelled{background:#565f8922;color:var(--gray)}
.badge-cancelling{background:#565f8922;color:var(--gray);animation:pulse 1.5s ease-in-out infinite}
.badge-created{background:#565f8922;color:var(--gray)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ── Main Panel ────────────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;padding:0}
#main-inner{max-width:900px;margin:0 auto;padding:24px 24px 80px}

/* Empty / loading states */
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);gap:8px;text-align:center;padding:40px}
.state-msg .icon{font-size:36px;opacity:.4}
.state-msg .title{font-size:16px;font-weight:600;color:var(--text)}
.state-msg .sub{font-size:13px}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Run Card ──────────────────────────────────────────────────── */
.run-card{margin-bottom:24px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg-surface)}
.run-header{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:var(--bg-raised);border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.run-header .run-id{font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.run-header .run-time{font-size:11px;color:var(--text-dim);margin-left:auto}
.run-body{padding:16px}
.run-error{background:#f7768e15;border:1px solid #f7768e44;border-radius:6px;padding:10px 14px;margin-bottom:12px;color:var(--red);font-size:13px}
.run-error .err-code{font-weight:700;margin-right:4px}

/* ── Messages ──────────────────────────────────────────────────── */
.msg{margin-bottom:14px}
.msg:last-child{margin-bottom:0}
.msg-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.msg-label.user{color:var(--cyan)}
.msg-label.agent{color:var(--purple)}

.msg-content{
  padding:12px 16px;border-radius:8px;font-size:13.5px;line-height:1.7;
  overflow-x:auto;
}
.msg.user-msg .msg-content{background:var(--bg-raised);border:1px solid var(--border)}
.msg.agent-msg .msg-content{background:#7aa2f708;border:1px solid #7aa2f722}

/* Markdown inside messages */
.msg-content h1,.msg-content h2,.msg-content h3,.msg-content h4{color:var(--text-bright);margin:12px 0 6px;line-height:1.3}
.msg-content h1{font-size:18px}.msg-content h2{font-size:16px}.msg-content h3{font-size:14px}
.msg-content p{margin:6px 0}
.msg-content ul,.msg-content ol{margin:6px 0 6px 20px}
.msg-content li{margin:2px 0}
.msg-content code{font-family:var(--font-mono);background:var(--bg);padding:1px 5px;border-radius:3px;font-size:12.5px}
.msg-content pre{background:var(--bg);padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0}
.msg-content pre code{padding:0;background:none;font-size:12px;line-height:1.5}
.msg-content blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-dim);margin:8px 0}
.msg-content table{border-collapse:collapse;margin:8px 0;width:100%}
.msg-content th,.msg-content td{border:1px solid var(--border);padding:6px 10px;text-align:left;font-size:13px}
.msg-content th{background:var(--bg-raised);font-weight:600}
.msg-content img{max-width:100%;border-radius:6px}
.msg-content hr{border:none;border-top:1px solid var(--border);margin:12px 0}

/* ── Tool Trajectory ───────────────────────────────────────────── */
.trajectory{
  margin:8px 0;border:1px solid var(--border);border-radius:6px;
  overflow:hidden;background:var(--bg);
}
.trajectory-header{
  display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  background:var(--bg-raised);font-size:12px;user-select:none;
}
.trajectory-header:hover{background:var(--bg-hover)}
.trajectory-header .arrow{transition:transform .2s;color:var(--text-dim);font-size:10px}
.trajectory-header.open .arrow{transform:rotate(90deg)}
.trajectory-header .tool-name{font-family:var(--font-mono);color:var(--accent);font-weight:600}
.trajectory-header .tool-label{color:var(--text-dim)}
.trajectory-body{display:none;padding:10px 12px;font-size:12px;border-top:1px solid var(--border)}
.trajectory-body.open{display:block}
.trajectory-body .section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:8px 0 4px;font-weight:600}
.trajectory-body .section-label:first-child{margin-top:0}
.trajectory-body pre{background:var(--bg-surface);padding:10px;border-radius:4px;overflow-x:auto;font-size:11.5px;line-height:1.5;color:var(--text);font-family:var(--font-mono)}

/* ── Shell Block ───────────────────────────────────────────────── */
.shell-block{
  margin:8px 0;border:1px solid #565f8944;border-radius:6px;
  overflow:hidden;background:var(--bg);font-family:var(--font-mono);font-size:12px;
}
.shell-cmd{padding:8px 12px;background:var(--bg-raised);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.shell-cmd .prompt{color:var(--green);font-weight:700}
.shell-cmd .cmd{color:var(--text-bright)}
.shell-output{padding:8px 12px;white-space:pre-wrap;color:var(--text-dim);max-height:300px;overflow-y:auto;line-height:1.45}
.shell-exit{padding:4px 12px;font-size:11px;border-top:1px solid var(--border)}
.shell-exit.ok{color:var(--green)}
.shell-exit.err{color:var(--red)}

/* ── Session detail header ─────────────────────────────────────── */
.session-header{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.session-header .sh-name{font-size:20px;font-weight:700;color:var(--text-bright)}
.session-header .sh-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--text-dim)}
.session-header .sh-id{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}

/* ── Responsive ────────────────────────────────────────────────── */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;z-index:100;transform:translateX(-100%);transition:transform .25s;width:280px;min-width:280px}
  #sidebar.open{transform:translateX(0)}
  #btn-sidebar-toggle{display:block}
  #main-inner{padding:16px}
}

/* ── Scrollbar ─────────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gray)}
</style>
</head>
<body>
<div id="app">

  <!-- Top Bar -->
  <div id="topbar">
    <button id="btn-sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
    <div class="logo"><span>◆</span> Nora ACP</div>
    <div id="conn-status" class="err"></div>
    <div id="conn-label">Connecting…</div>
    <div class="topbar-spacer"></div>
    <button id="btn-refresh" onclick="refresh()" title="Refresh">↻ Refresh</button>
  </div>

  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>Sessions</h2>
        <input id="filter-input" type="text" placeholder="Filter sessions…" oninput="renderSessionList()">
      </div>
      <div id="session-list"></div>
    </div>

    <!-- Main Panel -->
    <div id="main">
      <div id="main-inner">
        <div class="state-msg" id="welcome-state">
          <div class="icon">◆</div>
          <div class="title">Nora ACP Dashboard</div>
          <div class="sub">Select a session from the sidebar to view its runs.</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  Configuration
// ══════════════════════════════════════════════════════════════════
const BASE_URL = 'http://localhost:8000';

// ══════════════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════════════
let sessions = [];
let selectedSessionId = null;
let currentRuns = [];
let connected = false;

// ══════════════════════════════════════════════════════════════════
//  Markdown setup
// ══════════════════════════════════════════════════════════════════
function renderMarkdown(text) {
  if (typeof marked !== 'undefined') {
    try {
      return marked.parse(text, { breaks: true, gfm: true });
    } catch (e) { /* fallback */ }
  }
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ══════════════════════════════════════════════════════════════════
//  API helpers
// ══════════════════════════════════════════════════════════════════
async function api(path) {
  const resp = await fetch(BASE_URL + path);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function ping() {
  try {
    await api('/ping');
    setConnected(true);
  } catch {
    setConnected(false);
  }
}

function setConnected(ok) {
  connected = ok;
  const dot = document.getElementById('conn-status');
  const label = document.getElementById('conn-label');
  dot.className = ok ? 'ok' : 'err';
  label.textContent = ok ? BASE_URL : 'Disconnected';
}

// ══════════════════════════════════════════════════════════════════
//  Time helpers
// ══════════════════════════════════════════════════════════════════
function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 10) return 'just now';
  if (diff < 60) return Math.floor(diff) + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString();
}

function duration(start, end) {
  if (!start) return '';
  const s = new Date(start).getTime();
  const e = end ? new Date(end).getTime() : Date.now();
  const ms = e - s;
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return (ms / 60000).toFixed(1) + 'm';
}

// ══════════════════════════════════════════════════════════════════
//  Session List
// ══════════════════════════════════════════════════════════════════
async function fetchSessions() {
  try {
    const data = await api('/sessions');
    sessions = data.sessions || [];
    renderSessionList();
  } catch (e) {
    console.error('Failed to fetch sessions:', e);
  }
}

function renderSessionList() {
  const container = document.getElementById('session-list');
  const filter = (document.getElementById('filter-input').value || '').toLowerCase();
  const filtered = sessions.filter(s => {
    const name = (s.metadata && s.metadata.name) || s.id || '';
    return name.toLowerCase().includes(filter);
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="state-msg" style="height:auto;padding:32px 16px"><div class="sub">' +
      (sessions.length === 0 ? 'No sessions yet.' : 'No matches.') + '</div></div>';
    return;
  }

  container.innerHTML = filtered.map(s => {
    const name = (s.metadata && s.metadata.name) || `Session ${(s.id || '').substring(0, 8)}`;
    const mode = (s.metadata && s.metadata.mode) || 'vibe';
    const time = relTime(s.metadata && s.metadata.updated_at || s.created_at);
    const active = s.id === selectedSessionId ? ' active' : '';
    return `<div class="session-item${active}" onclick="selectSession('${s.id}')" title="${escapeHtml(s.id)}">
      <div class="name">${escapeHtml(name)}</div>
      <div class="meta">
        <span class="badge badge-${mode}">${mode}</span>
        <span class="time">${time}</span>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════════
//  Select Session & Load Runs
// ══════════════════════════════════════════════════════════════════
async function selectSession(id) {
  selectedSessionId = id;
  renderSessionList();
  closeSidebar();

  const main = document.getElementById('main-inner');
  main.innerHTML = '<div class="state-msg"><div class="spinner"></div><div class="sub">Loading runs…</div></div>';

  try {
    const [sessData, runsData] = await Promise.all([
      api(`/sessions/${id}`),
      api(`/sessions/${id}/runs`),
    ]);
    currentRuns = runsData.runs || [];
    renderRuns(sessData, currentRuns);
  } catch (e) {
    main.innerHTML = `<div class="state-msg"><div class="icon">⚠</div><div class="title">Failed to load</div><div class="sub">${escapeHtml(e.message)}</div></div>`;
  }
}

// ══════════════════════════════════════════════════════════════════
//  Render Runs
// ══════════════════════════════════════════════════════════════════
function renderRuns(session, runs) {
  const main = document.getElementById('main-inner');

  const name = (session.metadata && session.metadata.name) || `Session ${(session.id || '').substring(0, 8)}`;
  const mode = (session.metadata && session.metadata.mode) || 'vibe';

  let html = `<div class="session-header">
    <div class="sh-name">${escapeHtml(name)}</div>
    <div class="sh-meta">
      <span class="badge badge-${mode}">${mode}</span>
      <span class="sh-id">${session.id}</span>
      <span>${relTime(session.created_at)}</span>
      <span>${runs.length} run${runs.length !== 1 ? 's' : ''}</span>
    </div>
  </div>`;

  if (runs.length === 0) {
    html += '<div class="state-msg" style="height:auto;padding:40px"><div class="sub">No runs in this session.</div></div>';
    main.innerHTML = html;
    return;
  }

  for (const run of runs) {
    html += renderRunCard(run);
  }

  main.innerHTML = html;

  // Attach trajectory toggle listeners
  main.querySelectorAll('.trajectory-header').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('open');
      el.nextElementSibling.classList.toggle('open');
    });
  });
}

function renderRunCard(run) {
  const shortId = (run.run_id || '').substring(0, 8);
  const status = run.status || 'created';

  let html = `<div class="run-card">
    <div class="run-header">
      <span class="run-id">${shortId}</span>
      <span class="badge badge-${status}">${status}</span>
      <span class="run-time">${fmtTime(run.created_at)}${run.finished_at ? ' · ' + duration(run.created_at, run.finished_at) : status === 'in-progress' ? ' · ' + duration(run.created_at, null) + '…' : ''}</span>
    </div>
    <div class="run-body">`;

  // Error
  if (run.error) {
    html += `<div class="run-error"><span class="err-code">${escapeHtml(run.error.code || 'error')}:</span> ${escapeHtml(run.error.message || JSON.stringify(run.error))}</div>`;
  }

  // Input messages
  if (run.input && run.input.length) {
    for (const msg of run.input) {
      html += renderMessage(msg);
    }
  }

  // Output messages
  if (run.output && run.output.length) {
    for (const msg of run.output) {
      html += renderMessage(msg);
    }
  }

  html += '</div></div>';
  return html;
}

// ══════════════════════════════════════════════════════════════════
//  Render a single AcpMessage
// ══════════════════════════════════════════════════════════════════
function renderMessage(msg) {
  const role = msg.role || 'user';
  const isUser = role === 'user';
  const isAgent = role.startsWith('agent');
  const roleLabel = isUser ? 'User' : role;
  const roleClass = isUser ? 'user' : 'agent';
  const msgClass = isUser ? 'user-msg' : 'agent-msg';

  // Check if all parts are trajectory-only (non-displayable)
  const parts = msg.parts || [];
  const allTrajectory = parts.length > 0 && parts.every(p => p.metadata && p.metadata.kind === 'trajectory');

  // Build parts HTML
  let partsHtml = '';
  let hasVisibleContent = false;

  for (const part of parts) {
    const meta = part.metadata;

    // Shell block
    if (meta && meta.kind === 'nora:shell') {
      hasVisibleContent = true;
      const exitOk = (meta.exit_code || 0) === 0;
      partsHtml += `<div class="shell-block">
        <div class="shell-cmd"><span class="prompt">$</span><span class="cmd">${escapeHtml(part.content || '')}</span></div>
        ${meta.output ? `<div class="shell-output">${escapeHtml(meta.output)}</div>` : ''}
        <div class="shell-exit ${exitOk ? 'ok' : 'err'}">exit ${meta.exit_code ?? 0}</div>
      </div>`;
      continue;
    }

    // Trajectory block (collapsible)
    if (meta && meta.kind === 'trajectory') {
      partsHtml += renderTrajectory(meta);
      continue;
    }

    // Citation
    if (meta && meta.kind === 'citation') {
      hasVisibleContent = true;
      partsHtml += `<div style="margin:4px 0;font-size:12px">📎 <a href="${escapeHtml(meta.url || '#')}" target="_blank">${escapeHtml(meta.title || meta.url || 'Citation')}</a>${meta.description ? ' — ' + escapeHtml(meta.description) : ''}</div>`;
      continue;
    }

    // Text / JSON content
    if (part.content != null) {
      hasVisibleContent = true;
      if (part.content_type === 'application/json') {
        let pretty = part.content;
        try { pretty = JSON.stringify(JSON.parse(part.content), null, 2); } catch {}
        partsHtml += `<pre><code>${escapeHtml(pretty)}</code></pre>`;
      } else {
        partsHtml += renderMarkdown(part.content);
      }
    }
  }

  // If only trajectories and no other content, render as collapsed-only (no bubble wrapper)
  if (allTrajectory && !hasVisibleContent) {
    return `<div class="msg">${partsHtml}</div>`;
  }

  return `<div class="msg ${msgClass}">
    <div class="msg-label ${roleClass}">${escapeHtml(roleLabel)}</div>
    <div class="msg-content">${partsHtml}</div>
  </div>`;
}

function renderTrajectory(meta) {
  const name = meta.tool_name || 'unknown';
  let inputHtml = '';
  let outputHtml = '';

  if (meta.tool_input) {
    try {
      inputHtml = `<div class="section-label">Input</div><pre>${escapeHtml(JSON.stringify(meta.tool_input, null, 2))}</pre>`;
    } catch {
      inputHtml = `<div class="section-label">Input</div><pre>${escapeHtml(String(meta.tool_input))}</pre>`;
    }
  }

  if (meta.tool_output) {
    let out = meta.tool_output;
    // If it's a {result: "..."} wrapper, unwrap for readability
    if (typeof out === 'object' && out.result && Object.keys(out).length === 1 && typeof out.result === 'string') {
      // Show as plain text if it's just a string result
      outputHtml = `<div class="section-label">Output</div><pre>${escapeHtml(out.result)}</pre>`;
    } else {
      try {
        outputHtml = `<div class="section-label">Output</div><pre>${escapeHtml(JSON.stringify(out, null, 2))}</pre>`;
      } catch {
        outputHtml = `<div class="section-label">Output</div><pre>${escapeHtml(String(out))}</pre>`;
      }
    }
  }

  return `<div class="trajectory">
    <div class="trajectory-header">
      <span class="arrow">▶</span>
      <span class="tool-label">Tool:</span>
      <span class="tool-name">${escapeHtml(name)}</span>
      ${meta.message ? `<span style="color:var(--text-dim);margin-left:auto;font-size:11px">${escapeHtml(meta.message)}</span>` : ''}
    </div>
    <div class="trajectory-body">${inputHtml}${outputHtml}</div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════
//  Refresh & Polling
// ══════════════════════════════════════════════════════════════════
async function refresh() {
  await Promise.all([ping(), fetchSessions()]);
  if (selectedSessionId) {
    await selectSession(selectedSessionId);
  }
}

function hasActiveRuns() {
  return currentRuns.some(r =>
    ['created', 'in-progress', 'awaiting', 'cancelling'].includes(r.status)
  );
}

async function pollActiveRuns() {
  if (!selectedSessionId || !hasActiveRuns()) return;
  try {
    const runsData = await api(`/sessions/${selectedSessionId}/runs`);
    const sessData = await api(`/sessions/${selectedSessionId}`);
    currentRuns = runsData.runs || [];
    renderRuns(sessData, currentRuns);
  } catch (e) {
    console.error('Polling error:', e);
  }
}

// ══════════════════════════════════════════════════════════════════
//  Sidebar toggle (mobile)
// ══════════════════════════════════════════════════════════════════
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

// ══════════════════════════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════════════════════════
(async function init() {
  await ping();
  await fetchSessions();

  // Polling intervals
  setInterval(ping, 10000);
  setInterval(fetchSessions, 10000);
  setInterval(pollActiveRuns, 3000);
})();
</script>
